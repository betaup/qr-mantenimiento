# Analisis estatico de GitHub. Busca vulnerabilidades siguiendo como viajan los
# datos por el codigo; los hallazgos aparecen en la pestana Security.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: Analisis CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
